<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3584e4"/>
      <stop offset="100%" stop-color="#1c71d8"/>
    </linearGradient>
  </defs>
  <!-- Background Rounded Rect -->
  <rect x="8" y="16" width="112" height="96" rx="20" fill="url(#bg)" filter="drop-shadow(0px 4px 6px rgba(0,0,0,0.3))"/>
  
  <!-- Keyboard Keys (Upper Half) -->
  <rect x="20" y="28" width="14" height="14" rx="3" fill="#ffffff" opacity="0.9"/>
  <rect x="38" y="28" width="14" height="14" rx="3" fill="#ffffff" opacity="0.9"/>
  <rect x="56" y="28" width="14" height="14" rx="3" fill="#ffffff" opacity="0.9"/>
  <rect x="74" y="28" width="14" height="14" rx="3" fill="#ffffff" opacity="0.9"/>
  <rect x="92" y="28" width="16" height="14" rx="3" fill="#ffffff" opacity="0.9"/>

  <rect x="20" y="46" width="16" height="14" rx="3" fill="#ffffff" opacity="0.9"/>
  <rect x="40" y="46" width="14" height="14" rx="3" fill="#ffffff" opacity="0.9"/>
  <rect x="58" y="46" width="14" height="14" rx="3" fill="#ffffff" opacity="0.9"/>
  <rect x="76" y="46" width="14" height="14" rx="3" fill="#ffffff" opacity="0.9"/>
  <rect x="94" y="46" width="14" height="14" rx="3" fill="#ffffff" opacity="0.9"/>

  <!-- Touchpad Surface (Lower Half) -->
  <rect x="24" y="66" width="80" height="38" rx="8" fill="#15539e" stroke="#78aeed" stroke-width="2"/>
  <line x1="64" y1="90" x2="64" y2="104" stroke="#78aeed" stroke-width="2"/>
  <line x1="24" y1="90" x2="104" y2="90" stroke="#78aeed" stroke-width="2"/>
</svg>
